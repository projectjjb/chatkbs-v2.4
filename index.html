<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link rel="icon" href="https://www.google.com/favicon.ico" />
  </head>
  <body style="margin:0;">
    <div id="root">
      <div id="pre-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Consolas,monospace;background:#1e1f22;color:#8b8f99;font-size:13px;">
        불러오는 중...
      </div>
    </div>
    <script>
      // 모듈 로딩/실행 자체가 실패하는 경우(파일 경로 오류, 문법 오류 등)를 잡기 위한 최후 안전망.
      // React가 정상 렌더링되면 <div id="root">의 내용이 교체되면서 이 코드는 아무 영향도 주지 않는다.
      function showFatal(title, detail) {
        var root = document.getElementById("root");
        if (!root) return;
        if (root.querySelector("#pre-fallback") == null && root.children.length > 0) return; // 이미 React가 떴으면 건드리지 않음
        root.innerHTML =
          '<div style="min-height:100vh;padding:24px;background:#1e1f22;color:#fff;font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;">' +
          '<div style="color:#ed4245;font-weight:700;font-size:16px;margin-bottom:12px;">' + title + '</div>' +
          '<div>' + String(detail || "").replace(/</g, "&lt;") + '</div>' +
          "</div>";
      }
      window.addEventListener("error", function (e) {
        showFatal("페이지를 불러오지 못했습니다", (e.message || e.error || "알 수 없는 오류") + "\n\n파일: " + (e.filename || "-") + ":" + (e.lineno || "-"));
      });
      // fetch 실패 등 Promise 안에서 발생한 에러는 위 error 이벤트로 안 잡히므로 따로 처리
      window.addEventListener("unhandledrejection", function (e) {
        var reason = e.reason;
        var msg = (reason && (reason.message || reason.toString && reason.toString())) || String(reason);
        showFatal("네트워크/비동기 처리 중 오류가 발생했습니다", msg);
      });
      // 8초 안에 React가 뜨지 못하면(=root가 여전히 로딩 표시 그대로면) 원인 안내로 전환
      setTimeout(function () {
        var stuck = document.getElementById("pre-fallback");
        if (stuck) {
          stuck.outerHTML =
            '<div style="min-height:100vh;padding:24px;background:#1e1f22;color:#fff;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.7;">' +
            '<div style="color:#ed4245;font-weight:700;font-size:16px;margin-bottom:10px;">화면이 뜨지 않고 있습니다</div>' +
            "스크립트는 실행됐지만 화면 그리기가 끝나지 않았습니다.<br/>" +
            "Supabase 서버 응답이 없거나(CORS/네트워크 차단), 무한 대기 중일 가능성이 있습니다.<br/><br/>" +
            "확인해주세요: <code>src/AuthGate.jsx</code> 상단의 SUPABASE_URL과 SUPABASE_ANON_KEY 값이 정확한지." +
            "</div>";
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      type="module"을 지원하지 않는 아주 오래된 브라우저를 위한 안내.
      module을 지원하는 브라우저는 이 스크립트를 아예 무시하고 실행하지 않는다.
    -->
    <script nomodule>
      document.getElementById("root").innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:ui-monospace,Consolas,monospace;background:#1e1f22;color:#fff;">' +
        '이 브라우저는 최신 기능을 지원하지 않아 페이지를 열 수 없습니다.<br/>Chrome 최신 버전으로 시도해주세요.' +
        "</div>";
    </script>
  </body>
</html>
